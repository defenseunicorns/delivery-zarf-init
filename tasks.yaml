# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/tasks.schema.json

includes:
  - package: ./tasks/package.yaml
  - cluster: ./tasks/cluster.yaml
  - test: ./tasks/test.yaml
  - lint: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.27.2/tasks/lint.yaml
  - actions: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.27.2/tasks/actions.yaml

variables:
  - name: FLAVOR
    default: upstream
  - name: PACKAGE
    # gitea is the superset package (injector, registry, agent, gitea) so it gets deploy-tested
    default: gitea
  - name: ARCH
    # empty resolves to the host architecture (UDS_ARCH)
    default: ""
  - name: CLUSTER_NAME
    # override to run side-by-side clusters, e.g. --set CLUSTER_NAME=zarf-unicorn
    default: zarf
  - name: ZARF_VERSION
    # Overrides zarf_source_version from the flavor config.
    default: ""
  - name: PACKAGE_VERSION
    # Overrides the flavor version from releaser.yaml; pair with ZARF_VERSION.
    default: ""
  - name: REPO
    # Deprecated override for all flavors. Prefer PUBLIC_REPO and PRIVATE_REPO.
    default: ""
  - name: PUBLIC_REPO
    default: ghcr.io/defenseunicorns/delivery-zarf-init
  - name: PRIVATE_REPO
    default: ghcr.io/defenseunicorns/packages/private/delivery-zarf-init
  - name: TARGET_REPO
    default: ""
  - name: PUBLISH_RETRIES
    default: "3"

tasks:
  - name: default
    description: Local dev loop - vendor, build the PACKAGE, deploy and test on a fresh uds-k3d cluster
    actions:
      - task: package:vendor
      - task: package:create
      - task: cluster:setup
      - task: cluster:deploy
      - task: cluster:deploy-workload
      - task: test:all

  - name: dev
    description: Rebuild and redeploy the PACKAGE on the existing cluster (for iteration/dev speed)
    actions:
      - task: package:vendor
      - task: package:create
      - task: cluster:deploy

  - name: ci-test
    description: CI flow - build every package, then deploy and test the PACKAGE on a fresh uds-k3d cluster
    actions:
      - task: package:vendor
      - task: package:create-all
      - task: cluster:setup
      - task: cluster:deploy
      - task: cluster:deploy-workload
      - task: test:all

  - name: pre-commit-all
    description: Run pre-commit hooks, the uds-common lint suite, and fix SPDX license headers
    actions:
      - cmd: pre-commit run --all-files --show-diff-on-fail --color=always
      - task: lint:yaml
      - task: lint:shell
      # quiet on success; the tasks linter dry-runs every task and prints each rendered script
      - cmd: |
          log=$(mktemp)
          uds run lint:tasks --no-progress >"$log" 2>&1 || { cat "$log"; exit 1; }
      # helm linters scoped to repo-owned paths (the vendored .zarf-src charts are upstream's)
      - task: lint:helm
        with:
          paths: src packages
      - task: lint:helm-template
        with:
          paths: src packages
      - task: lint:license
        with:
          fix: "true"
