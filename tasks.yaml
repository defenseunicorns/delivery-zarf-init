# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/tasks.schema.json

includes:
  - test: ./tasks/test.yaml
  - lint: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.27.0/tasks/lint.yaml
  - actions: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.27.0/tasks/actions.yaml

variables:
  - name: FLAVOR
    default: upstream
  - name: PACKAGE
    # gitea is the superset package (injector, registry, agent, gitea) so it gets deploy-tested
    default: gitea
  - name: ARCH
    # empty resolves to the host architecture (UDS_ARCH)
    default: ""
  - name: CLUSTER_NAME
    # override to run side-by-side clusters, e.g. --set CLUSTER_NAME=zarf-unicorn
    default: zarf
  - name: ZARF_VERSION
    # renovate: datasource=docker depName=registry1.dso.mil/ironbank/opensource/zarf-dev/zarf/zarf-agent versioning=docker
    default: v0.81.1
  - name: REPO
    default: ghcr.io/defenseunicorns/delivery-zarf-init

tasks:
  - name: default
    description: Local dev loop - vendor, build the PACKAGE, deploy and test on a fresh uds-k3d cluster
    actions:
      - task: vendor
      - task: create
      - task: setup-cluster
      - task: deploy
      - task: deploy-workload
      - task: test:all

  - name: dev
    description: Rebuild and redeploy the PACKAGE on the existing cluster (for iteration/dev speed)
    actions:
      - task: vendor
      - task: create
      - task: deploy

  - name: ci-test
    description: CI flow - build every package, then deploy and test the PACKAGE on a fresh uds-k3d cluster
    actions:
      - task: vendor
      - task: create-all
      - task: setup-cluster
      - task: deploy
      - task: deploy-workload
      - task: test:all

  - name: vendor
    description: Vendor the upstream Zarf package definitions matching ZARF_VERSION (skips if already vendored)
    actions:
      - cmd: |
          if [ -d .zarf-src ]; then
            echo ".zarf-src already vendored; 'rm -rf .zarf-src' to re-vendor"
            exit 0
          fi
          git clone --depth 1 --branch "${ZARF_VERSION}" --filter=blob:none --sparse \
            https://github.com/zarf-dev/zarf.git .zarf-src
          git -C .zarf-src sparse-checkout set packages

  - name: create
    description: Build one package for FLAVOR/ARCH (config resolved from zarf-config/)
    inputs:
      package:
        description: The package (component set) to build
        default: ${PACKAGE}
    actions:
      - cmd: |
          pkg_arch="${ARCH}"
          [ -n "$pkg_arch" ] || pkg_arch="${UDS_ARCH}"
          suffix=""
          [ "${{ .inputs.package }}" = "default" ] || suffix="-${{ .inputs.package }}"
          config="zarf-config/${FLAVOR}-$pkg_arch.yaml"
          [ -f "$config" ] || config="zarf-config/${FLAVOR}.yaml"
          ZARF_CONFIG="$config" uds zarf package create "packages/${{ .inputs.package }}" \
            --flavor "${FLAVOR}" --set PKG_VERSION="${ZARF_VERSION}${suffix}" -a "$pkg_arch" --confirm

  - name: create-all
    description: Build every package for FLAVOR/ARCH
    actions:
      - task: create
        with:
          package: default
      - task: create
        with:
          package: agent-only
      - task: create
        with:
          package: gitea

  - name: setup-cluster
    description: Create a fresh uds-k3d test cluster (not zarf-initialized; cluster shape and k3s version are owned by uds-k3d)
    actions:
      - cmd: |
          k3d cluster delete "${CLUSTER_NAME}" >/dev/null 2>&1 || true
          # renovate: datasource=docker depName=ghcr.io/defenseunicorns/packages/uds-k3d versioning=docker
          uds zarf package deploy oci://ghcr.io/defenseunicorns/packages/uds-k3d:0.20.2 \
            --set CLUSTER_NAME="${CLUSTER_NAME}" --confirm

  - name: deploy
    description: Deploy the PACKAGE init package with the test values override applied
    actions:
      # zarf's built-in health checks gate each chart install, so no extra wait is needed here
      - cmd: |
          pkg_arch="${ARCH}"
          [ -n "$pkg_arch" ] || pkg_arch="${UDS_ARCH}"
          suffix=""
          [ "${PACKAGE}" = "default" ] || suffix="-${PACKAGE}"
          uds zarf package deploy zarf-init-"$pkg_arch"-"${ZARF_VERSION}$suffix"-"${FLAVOR}".tar.zst \
            --values tests/zarf-values-override.yaml --confirm

  - name: deploy-workload
    description: Deploy the DOS games package (exercises the registry and agent mutation)
    actions:
      - cmd: |
          pkg_arch="${ARCH}"
          [ -n "$pkg_arch" ] || pkg_arch="${UDS_ARCH}"
          uds zarf package deploy oci://ghcr.io/zarf-dev/packages/dos-games:1.2.0 \
            --confirm -a "$pkg_arch"

  - name: setup-uds-cluster
    description: Create a uds-k3d cluster (with MinIO) using the test overrides in tests/uds-config.yaml
    actions:
      - cmd: |
          # renovate: datasource=docker depName=ghcr.io/defenseunicorns/packages/uds/bundles/k3d-core-slim-dev versioning=docker
          UDS_CONFIG=tests/uds-config.yaml uds deploy \
            oci://ghcr.io/defenseunicorns/packages/uds/bundles/k3d-core-slim-dev:0.58.1 \
            -p uds-k3d-dev --confirm

  - name: deploy-s3
    description: Deploy the PACKAGE init package with the registry backed by uds-k3d MinIO (see tests/zarf-values-s3.yaml)
    actions:
      - cmd: |
          pkg_arch="${ARCH}"
          [ -n "$pkg_arch" ] || pkg_arch="${UDS_ARCH}"
          suffix=""
          [ "${PACKAGE}" = "default" ] || suffix="-${PACKAGE}"
          uds zarf package deploy zarf-init-"$pkg_arch"-"${ZARF_VERSION}$suffix"-"${FLAVOR}".tar.zst \
            --values tests/zarf-values-override.yaml --values tests/zarf-values-s3.yaml --confirm

  - name: remove
    description: Remove the deployed init package (only one init package can exist per cluster; run this before deploying a different package)
    actions:
      - cmd: uds zarf package remove init --confirm

  - name: publish
    description: Build and publish the PACKAGE for FLAVOR (both architectures) to REPO
    inputs:
      package:
        description: The package (component set) to publish
        default: ${PACKAGE}
    actions:
      - cmd: |
          package="${{ .inputs.package }}"
          suffix=""
          [ "$package" = "default" ] || suffix="-$package"
          pkg_version="${ZARF_VERSION}${suffix}"
          tag="${ZARF_VERSION}-${FLAVOR}${suffix}"

          for arch in amd64 arm64; do
            config="zarf-config/${FLAVOR}-${arch}.yaml"
            [ -f "$config" ] || config="zarf-config/${FLAVOR}.yaml"

            ZARF_CONFIG="$config" uds zarf package create "packages/$package" \
              --flavor "${FLAVOR}" --set PKG_VERSION="$pkg_version" -a "$arch" --confirm
            uds zarf package publish zarf-init-"$arch"-"$pkg_version"-"${FLAVOR}".tar.zst "oci://${REPO}" --tag "$tag"
          done

  - name: pre-commit-all
    description: Run all pre-commit hooks and fix SPDX license headers on all files
    actions:
      - cmd: pre-commit run --all-files --show-diff-on-fail --color=always
      - task: lint:license
        with:
          fix: "true"

  - name: cleanup
    description: Tear down the uds-k3d test cluster and build artifacts
    actions:
      - cmd: |
          k3d cluster delete "${CLUSTER_NAME}" || true
          rm -f zarf-init-*.tar.zst
