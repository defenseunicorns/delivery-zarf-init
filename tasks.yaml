# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/tasks.schema.json

includes:
  - package: ./tasks/package.yaml
  - test: ./tasks/test.yaml
  - values: ./tasks/values.yaml
  - create: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/create.yaml
  - lint: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/lint.yaml
  - actions: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/actions.yaml

variables:
  # renovate: datasource=docker depName=ghcr.io/zarf-dev/zarf/agent versioning=docker
  - name: ZARF_SOURCE_VERSION
    default: v0.88.0
  - name: FLAVOR
    default: upstream
  - name: PACKAGE
    default: init
  - name: ARCH
    default: ""
  - name: CLUSTER_NAME
    default: uds
  - name: K3D_HTTP_PORT
    default: "8080"
  - name: K3D_HTTPS_PORT
    default: "8443"
  - name: K3D_API_PORT
    default: "6551"
  - name: TARGET_REPO
    default: ghcr.io/defenseunicorns/delivery-zarf-init
  - name: PUBLISH_RETRIES
    default: "3"

tasks:
  - name: default
    description: Create and install-test the selected init package
    actions:
      - task: test-install

  - name: create-package
    description: Create the selected package with the uds-common create task
    inputs:
      architecture:
        description: Package architecture
        default: ${ARCH}
      options:
        description: Additional options passed to package creation
        default: ""
    actions:
      - task: package:validate-configs
      - task: package:resolve
      - task: package:vendor
        with:
          architecture: ${{ .inputs.architecture }}
      - task: create:package
        with:
          path: ${PACKAGE_PATH}
          architecture: ${PACKAGE_ARCH}
          config: ${ZARF_CONFIG}
          options: --output "${PACKAGE_PATH}" ${{ .inputs.options }}

  - name: create-dev-package
    description: Create the selected package without an SBOM for local development
    actions:
      - task: create-package
        with:
          options: --skip-sbom

  - name: test-package
    description: Deploy and verify a registry-bearing package on a fresh cluster
    inputs:
      architecture:
        description: Package architecture
        default: ${ARCH}
    actions:
      - task: package:resolve
      - task: test:cluster
      - task: test:package
        with:
          architecture: ${{ .inputs.architecture }}
      - task: test:health-check
      - task: test:registry-health-check
        if: ${{ ne .variables.PACKAGE "init-agent-only" }}
      - task: test:workload
        if: ${{ ne .variables.PACKAGE "init-agent-only" }}
        with:
          architecture: ${{ .inputs.architecture }}
      - task: test:mutation
        if: ${{ ne .variables.PACKAGE "init-agent-only" }}
      - task: test:gitea-health-check
        if: ${{ eq .variables.PACKAGE "init-gitea" }}
      - task: test:gitea-smoke
        if: ${{ eq .variables.PACKAGE "init-gitea" }}

  - name: test-install
    description: Create and install-test the selected package
    actions:
      - task: create-dev-package
      - task: test-package

  - name: dev
    description: Recreate and deploy the selected package on an existing development cluster
    actions:
      - task: create-dev-package
      - task: test:package

  - name: publish-package
    description: Create both architectures, test when deployable, and publish the selected package
    actions:
      - task: create-package
        with:
          architecture: amd64
      - task: create-package
        with:
          architecture: arm64
      - task: test-package
        if: ${{ ne .variables.PACKAGE "init-agent-only" }}
        with:
          architecture: amd64
      - task: package:publish
        with:
          architecture: amd64
      - task: package:publish
        with:
          architecture: arm64

  - name: bump-release
    description: Assign the next repository UDS revision to selected package flavors
    inputs:
      file:
        description: Releaser file to update
        default: releaser.yaml
    actions:
      - cmd: |
          release_file="${{ .inputs.file }}"
          package_selector="${PACKAGE}"
          flavor_selector="${FLAVOR}"

          if [ ! -f "$release_file" ]; then
            echo "releaser file not found: $release_file" >&2
            exit 1
          fi

          match_count=$(PACKAGE_SELECTOR="$package_selector" FLAVOR_SELECTOR="$flavor_selector" yq -r '
            [
              .packages[] |
              select(env(PACKAGE_SELECTOR) == "all" or .name == env(PACKAGE_SELECTOR)) |
              .flavors[] |
              select(env(FLAVOR_SELECTOR) == "all" or .name == env(FLAVOR_SELECTOR))
            ] | length
          ' "$release_file")
          if [ "$match_count" -eq 0 ]; then
            echo "no releaser entries match package=$package_selector flavor=$flavor_selector" >&2
            exit 1
          fi

          max_revision=$(SOURCE_VERSION="${ZARF_SOURCE_VERSION}" yq -r '
            .packages[].flavors[].version |
            split("-uds.") as $parts |
            select(($parts | length) == 2 and $parts[0] == env(SOURCE_VERSION)) |
            $parts[1]
          ' "$release_file" | sort -n | tail -n 1)
          if [ -z "$max_revision" ]; then
            echo "no releases match Zarf version ${ZARF_SOURCE_VERSION}" >&2
            exit 1
          fi

          release_version="${ZARF_SOURCE_VERSION}-uds.$((max_revision + 1))"
          PACKAGE_SELECTOR="$package_selector" \
          FLAVOR_SELECTOR="$flavor_selector" \
          RELEASE_VERSION="$release_version" \
            yq -i '
              (.packages[] |
                select(env(PACKAGE_SELECTOR) == "all" or .name == env(PACKAGE_SELECTOR)) |
                .flavors[] |
                select(env(FLAVOR_SELECTOR) == "all" or .name == env(FLAVOR_SELECTOR)) |
                .version) = env(RELEASE_VERSION)
            ' "$release_file"

          echo "Updated $match_count release entries to $release_version:"
          PACKAGE_SELECTOR="$package_selector" FLAVOR_SELECTOR="$flavor_selector" yq -r '
            .packages[] |
            select(env(PACKAGE_SELECTOR) == "all" or .name == env(PACKAGE_SELECTOR)) |
            . as $package |
            .flavors[] |
            select(env(FLAVOR_SELECTOR) == "all" or .name == env(FLAVOR_SELECTOR)) |
            "  \($package.name)/\(.name) -> \(.version)"
          ' "$release_file"

  - name: generate-zarf-values-schemas
    description: Regenerate schemas for packages that expose Zarf values
    actions:
      - task: package:vendor
      - task: values:generate

  - name: test-zarf-values
    description: Validate Zarf values schemas, rendered manifests, and generated Helm values files
    actions:
      - task: package:validate-configs
      - task: package:vendor
      - task: values:test

  - name: pre-commit-all
    description: Run pre-commit hooks and the repository-scoped uds-common lint suite
    actions:
      - cmd: pre-commit run --all-files --show-diff-on-fail --color=always
      - task: lint:yaml
      - task: lint:shell
      - cmd: |
          log=$(mktemp)
          uds run lint:tasks --no-progress >"$log" 2>&1 || { cat "$log"; exit 1; }
      - task: lint:license
        with:
          fix: "true"
