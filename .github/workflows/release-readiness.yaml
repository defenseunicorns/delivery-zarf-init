name: Release Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.36.0

      - name: Plan release
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          uds run publish:plan --no-progress \
            --set BASE_SHA="$BASE_SHA" --set HEAD_SHA="$HEAD_SHA" --set EVENT_NAME=pull_request \
            --set PR_TITLE="$PR_TITLE"

      - name: Sync Zarf agent readiness label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          label="waiting on zarf-agent"
          waiting=$(jq -c '.waitingForAgent' /tmp/delivery-zarf-init-release-plan.json)
          current_labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')

          if [ "$waiting" = "[]" ]; then
            if grep -Fxq "$label" <<< "$current_labels"; then
              gh pr edit "$PR_NUMBER" --remove-label "$label"
            fi
          elif ! grep -Fxq "$label" <<< "$current_labels"; then
            gh pr edit "$PR_NUMBER" --add-label "$label"
          fi

      - name: Validate release readiness
        run: |
          missing=$(jq -r '.missingVersions | join(" ")' /tmp/delivery-zarf-init-release-plan.json)
          unexpected=$(jq -r '.unexpectedVersions | join(" ")' /tmp/delivery-zarf-init-release-plan.json)
          waiting=$(jq -r '.waitingForAgent | join(" ")' /tmp/delivery-zarf-init-release-plan.json)
          [ -z "$missing" ] || { echo "Package version must advance for: $missing" >&2; exit 1; }
          [ -z "$unexpected" ] || { echo "PR title scope does not declare releases for: $unexpected" >&2; exit 1; }
          [ -z "$waiting" ] || { echo "Waiting for zarf-agent updates: $waiting" >&2; exit 1; }
