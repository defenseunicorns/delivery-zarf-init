name: Scan

on:
  pull_request:
    paths:
      # Disabled: callable-scan builds from a single root zarf.yaml via the standard create
      # tasks and cannot express this repo's variant matrix (vendored upstream definitions +
      # per-flavor ZARF_CONFIG). Image scanning is covered upstream (Iron Bank/Chainguard
      # flavors ship pre-hardened images). Re-enable by replacing DISABLED with real paths
      # if a variant-aware scan flow is added.
      - DISABLED

jobs:
  scan:
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write
    uses: defenseunicorns/uds-common/.github/workflows/callable-scan.yaml@12b03eba879f9e1c90fd0301cd8cd4b6a0b49960 # v1.27.0
    secrets: inherit
