name: Lint

on:
  pull_request:
    branches: [main]
    # Milestoning supports manual reruns.
    types: [milestoned, opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  run:
    uses: defenseunicorns/uds-common/.github/workflows/callable-lint.yaml@9cb4ebfd9f9a5efd1dbc454bf3aae843d0b57b9f # v1.32.2
    secrets: inherit

  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.40.0

      - name: Generate Zarf values schemas
        run: uds run generate-zarf-values-schemas --no-progress

      - name: Verify generated Zarf values schemas
        run: git diff --exit-code -- 'packages/*/zarf-values.schema.json'

      - name: Require preinstalled Go toolchain
        run: |
          go_version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' go.mod)
          if [ -z "$go_version" ] || [ ! -x "$RUNNER_TOOL_CACHE/go/$go_version/x64/bin/go" ]; then
            echo "Go $go_version is not preinstalled on this runner" >&2
            exit 1
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Test release automation
        run: uds run test-release-automation --no-progress

      - name: Run pre-commit hooks
        env:
          GOTOOLCHAIN: local
        run: |
          python -m pip install --requirement requirements-lint.txt
          pre-commit run --all-files --show-diff-on-failure
