name: Lint

on:
  pull_request:
    branches: [main]
    # milestoned is added here so that a PR can be re-triggered if it is milestoned.
    types: [milestoned, opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  run:
    uses: defenseunicorns/uds-common/.github/workflows/callable-lint.yaml@12b03eba879f9e1c90fd0301cd8cd4b6a0b49960 # v1.27.0
    secrets: inherit
