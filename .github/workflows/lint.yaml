name: Lint

on:
  pull_request:
    branches: [main]
    # Milestoning supports manual reruns.
    types: [milestoned, opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: defenseunicorns/uds-common/.github/workflows/callable-lint.yaml@477b80085617150a2a4985ac1e70afae968df764 # v1.33.1

  hk:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Generate Zarf values schemas
        run: uds run generate-zarf-values-schemas --no-progress

      - name: Verify generated Zarf values schemas
        run: git diff --exit-code -- 'packages/*/zarf-values.schema.json'

      - name: Run repository lint checks
        run: hk check --all
