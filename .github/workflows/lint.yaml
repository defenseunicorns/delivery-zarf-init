name: Lint

on:
  pull_request:
    branches: [main]
    # milestoned is added here so that a PR can be re-triggered if it is milestoned.
    types: [milestoned, opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  run:
    uses: defenseunicorns/uds-common/.github/workflows/callable-lint.yaml@a99629a47585162e7a133c6f58c9874268103155 # v1.28.3
    secrets: inherit
