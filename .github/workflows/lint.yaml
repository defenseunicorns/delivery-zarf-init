name: Lint

on:
  pull_request:
    branches: [main]
    # Milestoning supports manual reruns.
    types: [milestoned, opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hk:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.8

      - name: Generate Zarf values schemas
        run: uds run generate-zarf-values-schemas --no-progress

      - name: Verify generated Zarf values schemas
        run: git diff --exit-code -- 'packages/*/zarf-values.schema.json'

      - name: Run repository lint checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: hk check --all
