name: PR Title Check

on:
  pull_request:
    branches: [main]
    # Milestoning supports manual reruns.
    types: [milestoned, opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    uses: defenseunicorns/uds-common/.github/workflows/callable-commitlint.yaml@d940b16c44821fe7a84b7725bdadf7d4fa541c8f # v1.28.1
