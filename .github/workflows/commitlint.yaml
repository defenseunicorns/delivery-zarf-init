name: PR Title Check

on:
  pull_request:
    branches: [main]
    # Milestoning supports manual reruns.
    types: [milestoned, opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    uses: defenseunicorns/uds-common/.github/workflows/callable-commitlint.yaml@320e247b590fbdcf25a1f01e9b00db88bdd8a448 # v1.32.1
