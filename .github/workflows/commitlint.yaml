name: PR Title Check

on:
  pull_request:
    branches: [main]
    # milestoned is added here so that a PR can be re-triggered if it is milestoned.
    types: [milestoned, opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    uses: defenseunicorns/uds-common/.github/workflows/callable-commitlint.yaml@729f266d614a6e4f69876c2c69a789b78cc97853 # v1.28.0
