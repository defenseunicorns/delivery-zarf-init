name: Publish

on:
  push:
    branches:
      - main
    paths:
      - variants/**
      - zarf-config/**
      - tasks.yaml
      - tasks/**
      - tests/**
      - .github/workflows/test.yaml
      - .github/workflows/publish.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Queue publishes; never cancel one mid-flight
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: read
      id-token: write

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - upstream
          - registry1
          - unicorn
        variant:
          - default
          - agent-only
          - gitea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to registry1
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: registry1.dso.mil
          username: ${{ secrets.IRON_BANK_ROBOT_USERNAME }}
          password: ${{ secrets.IRON_BANK_ROBOT_PASSWORD }}

      - name: Chainguard Login
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@ab842abcad1f7a3305c2538e3dd1950d0daacfa5 # v1.0.1
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.34.2

      - name: Build and publish (${{ matrix.flavor }} / ${{ matrix.variant }})
        run: |
          uds run vendor --no-progress
          uds run publish \
            --set FLAVOR=${{ matrix.flavor }} \
            --set VARIANT=${{ matrix.variant }} \
            --no-progress
