name: Publish

on:
  push:
    branches:
      - main
    paths:
      - packages/**
      - src/**
      - zarf-config/**
      - tasks.yaml
      - tasks/**
      - tests/**
      - .github/workflows/test.yaml
      - .github/workflows/publish.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Queue publishes; never cancel one mid-flight
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: read
      id-token: write

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - upstream
          - registry1
          - unicorn
        package:
          - default
          - agent-only
          - gitea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@ab842abcad1f7a3305c2538e3dd1950d0daacfa5 # v1.0.1
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.35.1

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      - name: Build and publish (${{ matrix.flavor }} / ${{ matrix.package }})
        run: |
          uds run publish \
            --set FLAVOR=${{ matrix.flavor }} \
            --set PACKAGE=${{ matrix.package }} \
            --no-progress
