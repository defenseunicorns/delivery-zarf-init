name: Create Release Tag

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: create-release-tag-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  values:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.40.0

      - name: Validate Zarf values
        run: uds run test-zarf-values --no-progress

  tag:
    needs: values
    runs-on: ubuntu-26.04
    environment: uds-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.40.0

      # GITHUB_TOKEN-created tags do not trigger the tag release workflow.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create consolidated release tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          release_version=$(yq -r '.packages[].flavors[].version' releaser.yaml | sort -V | tail -n 1)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_version" > /dev/null 2>&1; then
            echo "$release_version already exists; no release requested"
            exit 0
          fi

          echo "Creating consolidated release tag $release_version at $GITHUB_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$release_version" \
            -f sha="$GITHUB_SHA"
