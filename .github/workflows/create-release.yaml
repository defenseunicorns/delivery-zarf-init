name: Create Releases

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: create-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  values:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.39.0
      - name: Validate Zarf values
        run: uds run test-zarf-values --no-progress

  release:
    needs: values
    runs-on: ubuntu-26.04
    environment: uds-release
    strategy:
      fail-fast: false
      matrix:
        package: [init, init-agent-only, init-gitea]
        flavor: [upstream, registry1, unicorn]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.39.0

      # GITHUB_TOKEN-created tags do not trigger the tag release workflow.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install release tooling
        run: uds run actions:setup-environment --no-progress

      - name: Create package release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          package_path=$(PACKAGE_NAME="${{ matrix.package }}" yq -r \
            '.packages[] | select(.name == env(PACKAGE_NAME)) | .path // ""' releaser.yaml)
          if [ -z "$package_path" ]; then
            echo "unknown package: ${{ matrix.package }}" >&2
            exit 1
          fi

          if (
            cd "$package_path" || exit 1
            uds-pk release check "${{ matrix.flavor }}" \
              --package "${{ matrix.package }}" \
              --dir "$GITHUB_WORKSPACE" \
              --skip-publish-check \
              --verbose
          ); then
            (
              cd "$package_path" || exit 1
              uds-pk release github "${{ matrix.flavor }}" \
                --package "${{ matrix.package }}" \
                --dir "$GITHUB_WORKSPACE"
            )
          fi
