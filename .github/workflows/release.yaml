name: Release

on:
  push:
    tags:
      - "*-upstream"
      - "*-registry1"
      - "*-unicorn"

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-26.04
    outputs:
      package: ${{ steps.release.outputs.package }}
      flavor: ${{ steps.release.outputs.flavor }}
      publish-repo: ${{ steps.release.outputs.publish-repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.39.0
      - name: Resolve package release
        id: release
        run: |
          for package in $(yq -r '.packages[].name' releaser.yaml); do
            for flavor in $(PACKAGE_NAME="$package" yq -r \
              '.packages[] | select(.name == env(PACKAGE_NAME)) | .flavors[].name' releaser.yaml); do
              version=$(PACKAGE_NAME="$package" FLAVOR_NAME="$flavor" yq -r \
                '.packages[] | select(.name == env(PACKAGE_NAME)) | .flavors[] | select(.name == env(FLAVOR_NAME)) | .version' \
                releaser.yaml)
              if [ "${package}-${version}-${flavor}" = "$GITHUB_REF_NAME" ]; then
                publish_repo="ghcr.io/defenseunicorns/delivery-zarf-init"
                if [ "$flavor" = "unicorn" ]; then
                  publish_repo="ghcr.io/defenseunicorns/packages/private/delivery-zarf-init"
                fi
                {
                  echo "package=$package"
                  echo "flavor=$flavor"
                  echo "publish-repo=$publish_repo"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "tag does not match a release in releaser.yaml: $GITHUB_REF_NAME" >&2
          exit 1

  values:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.39.0
      - name: Validate Zarf values
        run: uds run test-zarf-values --no-progress

  publish:
    needs: [resolve, values]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.39.0

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
            --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
            --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
            --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"

      - name: Create, test, sign, verify, and publish
        run: |
          uds-pk release update-yaml "${{ needs.resolve.outputs.flavor }}" \
            --package "${{ needs.resolve.outputs.package }}" \
            --dir "$GITHUB_WORKSPACE"
          uds run publish-package \
            --set PACKAGE="${{ needs.resolve.outputs.package }}" \
            --set FLAVOR="${{ needs.resolve.outputs.flavor }}" \
            --set TARGET_REPO="${{ needs.resolve.outputs.publish-repo }}" \
            --no-progress

      - name: Debug output
        if: ${{ always() }}
        run: uds run actions:debug-output

      - name: Save logs
        if: ${{ always() }}
        run: uds run actions:save-logs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: debug-log-${{ needs.resolve.outputs.package }}-${{ needs.resolve.outputs.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/zarf-*.log
            /tmp/uds-*.log
            /tmp/maru-*.log
            /tmp/debug-*.log
            /tmp/uds-containerd-logs
            /tmp/k3d-uds-*.log
