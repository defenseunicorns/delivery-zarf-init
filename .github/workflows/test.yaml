name: Test

on:
  pull_request:
    branches: [main]
    types: [milestoned, opened, reopened, synchronize]

permissions:
  contents: read
  packages: read
  pull-requests: read
  id-token: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      flavors: ${{ steps.flavors.outputs.flavors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        if: startsWith(github.head_ref, 'renovate/')
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.36.0

      - name: Check Renovate readiness
        if: startsWith(github.head_ref, 'renovate/')
        run: scripts/check-renovate-readiness.sh "${{ github.event.pull_request.base.sha }}"

      - name: Select test flavors
        id: flavors
        env:
          TRUSTED_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: |
          if [ "$TRUSTED_PR" = "true" ]; then
            echo 'flavors=["upstream","registry1","unicorn"]' >> "$GITHUB_OUTPUT"
          else
            echo 'flavors=["upstream"]' >> "$GITHUB_OUTPUT"
          fi

  values:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.36.0

      - name: Validate Zarf values
        run: uds run test-zarf-values --no-progress

  create-arm64:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [init, init-agent-only, init-gitea]
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.36.0

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
            --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
            --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
            --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"

      - name: Create ${{ matrix.package }} (${{ matrix.flavor }} / arm64)
        run: |
          uds run create-dev-package \
            --set PACKAGE="${{ matrix.package }}" \
            --set FLAVOR="${{ matrix.flavor }}" \
            --set ARCH=arm64 \
            --no-progress

  test-install:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [init, init-gitea]
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.36.0

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
            --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
            --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
            --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"

      - name: Install-test ${{ matrix.package }} (${{ matrix.flavor }})
        run: |
          uds run test-install \
            --set PACKAGE="${{ matrix.package }}" \
            --set FLAVOR="${{ matrix.flavor }}" \
            --set ARCH=amd64 \
            --no-progress

  verify-test:
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs: [plan, values, create-arm64, test-install]
    steps:
      - name: Verify required jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VALUES_RESULT: ${{ needs.values.result }}
          CREATE_RESULT: ${{ needs.create-arm64.result }}
          INSTALL_RESULT: ${{ needs.test-install.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ] || [ "$VALUES_RESULT" != "success" ] || [ "$CREATE_RESULT" != "success" ] || [ "$INSTALL_RESULT" != "success" ]; then
            echo "Required package validation failed" >&2
            exit 1
          fi
