name: Test

on:
  pull_request:
    paths:
      - packages/**
      - src/**
      - zarf-config/**
      - tasks.yaml
      - tasks/**
      - tests/**
      - .github/workflows/test.yaml
      - .github/workflows/publish.yaml
  # Allows publish.yaml to reuse this workflow so packages are tested before publishing
  workflow_call:

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - upstream
          - registry1
          - unicorn
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@ab842abcad1f7a3305c2538e3dd1950d0daacfa5 # v1.0.1
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.34.2

      - name: Environment setup
        run: |
          echo "MARU_AUTH=\"{\"raw.githubusercontent.com\": \"${{ secrets.GITHUB_TOKEN }}\"}\"" >> "$GITHUB_ENV"
          uds run actions:setup-environment \
          --set REGISTRY1_USERNAME="${{ secrets.IRON_BANK_ROBOT_USERNAME }}" \
          --set REGISTRY1_PASSWORD="${{ secrets.IRON_BANK_ROBOT_PASSWORD }}" \
          --set GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          --set CHAINGUARD_IDENTITY="${{ secrets.CHAINGUARD_IDENTITY }}"
        shell: bash

      - name: Build all packages, deploy, and test (${{ matrix.flavor }} / ${{ matrix.platform.arch }})
        run: |
          uds run ci-test \
            --set FLAVOR=${{ matrix.flavor }} \
            --set ARCH=${{ matrix.platform.arch }} \
            --no-progress

  verify-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Success
        run: echo "All tests passed successfully!"
