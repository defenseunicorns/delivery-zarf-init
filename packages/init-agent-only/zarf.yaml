# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfInitConfig
metadata:
  name: init-agent-only
  version: dev
  description: Used to establish a new Zarf cluster without an internal registry
  source: https://github.com/defenseunicorns/delivery-zarf-init
  annotations:
    dev.uds.title: Zarf Init (agent only)
    dev.uds.tagline: Customized Zarf init package for clusters using an external registry

values:
  files:
    - zarf-values.yaml
  schema: zarf-values.schema.json

components:
  - name: zarf-agent
    required: true
    import:
      path: ../../components
