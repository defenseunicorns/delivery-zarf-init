# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfInitConfig
metadata:
  name: init
  version: dev
  description: Used to establish a new Zarf cluster
  source: https://github.com/defenseunicorns/delivery-zarf-init
  annotations:
    dev.uds.title: Zarf Init
    dev.uds.tagline: Customized Zarf init package - injector, registry, and agent

values:
  files:
    - zarf-values.yaml
  schema: zarf-values.schema.json

components:
  - name: zarf-injector
    required: true
    import:
      path: ../../components

  - name: zarf-seed-registry
    required: true
    import:
      path: ../../components

  - name: zarf-registry
    required: true
    import:
      path: ../../components

  - name: zarf-agent
    required: true
    import:
      path: ../../components
