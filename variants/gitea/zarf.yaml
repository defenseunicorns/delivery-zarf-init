# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfInitConfig
metadata:
  name: init
  version: "###ZARF_PKG_TMPL_PKG_VERSION###"
  description: Used to establish a new Zarf cluster (agent, registry, and gitea git-server)
  source: https://github.com/defenseunicorns/delivery-zarf-init
  annotations:
    dev.uds.title: Zarf Init (gitea)
    dev.uds.tagline: Customized Zarf init package - injector, registry, agent, and gitea git-server

values:
  files:
    - zarf-values.yaml
  schema: zarf-values.schema.json

components:
  - name: zarf-injector
    required: true
    import:
      path: ../../.zarf-src/packages/zarf-registry

  - name: zarf-seed-registry
    required: true
    import:
      path: ../../.zarf-src/packages/zarf-registry

  - name: zarf-registry
    required: true
    import:
      path: ../../.zarf-src/packages/zarf-registry
    charts:
      - name: docker-registry
        values:
          - sourcePath: .zarf-registry
            targetPath: .
            excludePaths:
              - .zarf-registry.image
              - .zarf-registry.imagePullSecrets
              - .zarf-registry.proxy.image
              - .zarf-registry.proxy.registry
              - .zarf-registry.proxy.injector
              - .zarf-registry.secrets
              - .zarf-registry.mtls
              - .zarf-registry.fullnameOverride
              - .zarf-registry.ipv6Only
    healthChecks:
      - name: zarf-docker-registry
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment

  # Defined once per flavor so every --flavor matches a component.
  - name: zarf-agent
    required: true
    import:
      path: ../../.zarf-src/packages/zarf-agent
    only:
      flavor: upstream
    charts:
      - name: zarf-agent
        values:
          - sourcePath: .zarf-agent
            targetPath: .
            excludePaths:
              - .zarf-agent.image
              - .zarf-agent.secret
              - .zarf-agent.mutationPolicy
    healthChecks:
      - name: agent-hook
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment
  - name: zarf-agent
    required: true
    import:
      path: ../../.zarf-src/packages/zarf-agent
    only:
      flavor: registry1
    charts:
      - name: zarf-agent
        values:
          - sourcePath: .zarf-agent
            targetPath: .
            excludePaths:
              - .zarf-agent.image
              - .zarf-agent.secret
              - .zarf-agent.mutationPolicy
    healthChecks:
      - name: agent-hook
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment
  - name: zarf-agent
    required: true
    import:
      path: ../../.zarf-src/packages/zarf-agent
    only:
      flavor: unicorn
    charts:
      - name: zarf-agent
        values:
          - sourcePath: .zarf-agent
            targetPath: .
            excludePaths:
              - .zarf-agent.image
              - .zarf-agent.secret
              - .zarf-agent.mutationPolicy
    healthChecks:
      - name: agent-hook
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment

  - name: git-server
    required: true
    import:
      path: ../../.zarf-src/packages/gitea
    charts:
      - name: gitea
        values:
          - sourcePath: .gitea
            targetPath: .
            excludePaths:
              - .gitea.image
              - .gitea.gitea.admin
              - .gitea.podSecurityContext
              - .gitea.containerSecurityContext
    healthChecks:
      - name: zarf-gitea
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment
