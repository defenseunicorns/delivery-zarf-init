# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfInitConfig
metadata:
  name: init
  version: "###ZARF_PKG_TMPL_PKG_VERSION###"
  description: Used to establish a new Zarf cluster (agent only, no registry)
  source: https://github.com/defenseunicorns/delivery-zarf-init
  annotations:
    dev.uds.title: Zarf Init (agent only)
    dev.uds.tagline: Customized Zarf init package - agent only, for clusters using an external registry

values:
  files:
    - zarf-values.yaml
  schema: zarf-values.schema.json

# Defined once per flavor so every --flavor matches a component.
components:
  - name: zarf-agent
    required: true
    import:
      path: ../../.zarf-src/packages/zarf-agent
    only:
      flavor: upstream
    charts:
      - name: zarf-agent
        values:
          - sourcePath: .zarf-agent
            targetPath: .
            excludePaths:
              - .zarf-agent.image
              - .zarf-agent.secret
              - .zarf-agent.mutationPolicy
    healthChecks:
      - name: agent-hook
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment
  - name: zarf-agent
    required: true
    import:
      path: ../../.zarf-src/packages/zarf-agent
    only:
      flavor: registry1
    charts:
      - name: zarf-agent
        values:
          - sourcePath: .zarf-agent
            targetPath: .
            excludePaths:
              - .zarf-agent.image
              - .zarf-agent.secret
              - .zarf-agent.mutationPolicy
    healthChecks:
      - name: agent-hook
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment
  - name: zarf-agent
    required: true
    import:
      path: ../../.zarf-src/packages/zarf-agent
    only:
      flavor: unicorn
    charts:
      - name: zarf-agent
        values:
          - sourcePath: .zarf-agent
            targetPath: .
            excludePaths:
              - .zarf-agent.image
              - .zarf-agent.secret
              - .zarf-agent.mutationPolicy
    healthChecks:
      - name: agent-hook
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment
