# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
# Shared component definitions (values passthrough, healthChecks, chart pins) imported by the
# packages/*; flavor tagging stays in src/init/zarf.yaml.
kind: ZarfPackageConfig
metadata:
  name: common

components:
  - name: zarf-agent
    required: true
    import:
      path: ../../../.zarf-src/packages/zarf-agent
    charts:
      - name: zarf-agent
        values:
          - sourcePath: .zarf-agent
            targetPath: .
            excludePaths:
              - .zarf-agent.image
              - .zarf-agent.secret
              - .zarf-agent.mutationPolicy
    healthChecks:
      - name: agent-hook
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment

  - name: zarf-registry
    required: true
    import:
      path: ../../../.zarf-src/packages/zarf-registry
    charts:
      - name: docker-registry
        values:
          - sourcePath: .zarf-registry
            targetPath: .
            excludePaths:
              - .zarf-registry.image
              - .zarf-registry.imagePullSecrets
              - .zarf-registry.proxy.image
              - .zarf-registry.proxy.registry
              - .zarf-registry.proxy.injector
              - .zarf-registry.secrets
              - .zarf-registry.mtls
              - .zarf-registry.securityContext
              - .zarf-registry.fullnameOverride
              - .zarf-registry.ipv6Only
    healthChecks:
      - name: zarf-docker-registry
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment

  - name: git-server
    required: true
    import:
      path: ../../../.zarf-src/packages/gitea
    charts:
      - name: gitea
        # newer than upstream zarf's chart pin; gitea >=1.26 requires it
        # renovate: datasource=docker depName=registry-1.docker.io/giteacharts/gitea versioning=docker
        version: 12.7.0
        values:
          - sourcePath: .gitea
            targetPath: .
            excludePaths:
              - .gitea.image
              - .gitea.global.imageRegistry
              - .gitea.podSecurityContext
              - .gitea.containerSecurityContext
              - .gitea.securityContext
              - .gitea.extraContainers
              - .gitea.extraDeploy
              - .gitea.initPreScript
              - .gitea.postExtraInitContainers
              - .gitea.preExtraInitContainers
              - .gitea.gitea.admin
              - .gitea.postgresql.image
              - .gitea.postgresql.metrics.image
              - .gitea.postgresql.volumePermissions.image
              - .gitea.postgresql-ha.metrics.image
              - .gitea.postgresql-ha.pgpool.image
              - .gitea.postgresql-ha.postgresql.image
              - .gitea.postgresql-ha.volumePermissions.image
              - .gitea.test.image
              - .gitea.valkey.image
              - .gitea.valkey.kubectl.image
              - .gitea.valkey.metrics.image
              - .gitea.valkey.sentinel.image
              - .gitea.valkey.volumePermissions.image
              - .gitea.valkey-cluster.image
              - .gitea.valkey-cluster.metrics.image
              - .gitea.valkey-cluster.sysctlImage
              - .gitea.valkey-cluster.volumePermissions.image
    healthChecks:
      - name: zarf-gitea
        namespace: zarf
        apiVersion: apps/v1
        kind: Deployment
