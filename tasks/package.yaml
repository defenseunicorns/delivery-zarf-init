# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/tasks.schema.json

tasks:
  - name: validate-configs
    description: Validate package metadata and every flavor configuration
    actions:
      - cmd: |
          required_keys="pkg_version agent_image agent_image_tag registry_image registry_image_tag proxy_image proxy_image_tag gitea_image"
          for config in flavors/*.yaml; do
            for key in $required_keys; do
              value=$(KEY="$key" yq -r '.package.create.set[env(KEY)] // ""' "$config")
              if [ -z "$value" ]; then
                echo "$config: missing package.create.set.$key" >&2
                exit 1
              fi
            done
            agent_version=$(yq -r '.package.create.set.agent_image_tag' "$config")
            agent_version=${agent_version%-arm64}
            if [ "$agent_version" != "${ZARF_SOURCE_VERSION}" ]; then
              echo "$config: agent image version $agent_version does not match ${ZARF_SOURCE_VERSION}" >&2
              exit 1
            fi
          done

          for package in $(yq -r '.packages[].name' releaser.yaml); do
            path=$(PACKAGE_NAME="$package" yq -r \
              '.packages[] | select(.name == env(PACKAGE_NAME)) | .path // ""' releaser.yaml)
            if [ ! -f "$path/zarf.yaml" ]; then
              echo "$package: missing package definition at $path/zarf.yaml" >&2
              exit 1
            fi
            metadata_name=$(yq -r '.metadata.name // ""' "$path/zarf.yaml")
            if [ "$metadata_name" != "$package" ]; then
              echo "$path/zarf.yaml: metadata.name is $metadata_name, expected $package" >&2
              exit 1
            fi
            for file in zarf-values.yaml zarf-values.schema.json; do
              if [ ! -f "$path/$file" ]; then
                echo "$package: missing $path/$file" >&2
                exit 1
              fi
            done
            for release_version in $(PACKAGE_NAME="$package" yq -r \
              '.packages[] | select(.name == env(PACKAGE_NAME)) | .flavors[].version' releaser.yaml); do
              source_version=${release_version%%-uds.*}
              if [ "$source_version" != "${ZARF_SOURCE_VERSION}" ]; then
                echo "$package: release version $release_version does not match ${ZARF_SOURCE_VERSION}" >&2
                exit 1
              fi
            done
          done

  - name: resolve
    description: Resolve PACKAGE to its path from releaser.yaml
    actions:
      - cmd: |
          path=$(PACKAGE_NAME="${PACKAGE}" yq -r \
            '.packages[] | select(.name == env(PACKAGE_NAME)) | .path // ""' releaser.yaml)
          if [ -z "$path" ]; then
            echo "unknown PACKAGE: ${PACKAGE}" >&2
            exit 1
          fi
          printf '%s\n' "$path"
        setVariables:
          - name: PACKAGE_PATH

  - name: resolve-config
    description: Resolve the flavor and architecture-specific Zarf config
    inputs:
      architecture:
        default: ${ARCH}
    actions:
      - cmd: |
          architecture="${{ .inputs.architecture }}"
          [ -n "$architecture" ] || architecture="${UDS_ARCH}"
          printf '%s\n' "$architecture"
        setVariables:
          - name: PACKAGE_ARCH
      - cmd: |
          config="flavors/${FLAVOR}.yaml"
          if [ "$FLAVOR" = "registry1" ] && [ "$PACKAGE_ARCH" = "arm64" ]; then
            config="flavors/registry1-arm64.yaml"
          fi
          if [ ! -f "$config" ]; then
            echo "missing Zarf config: $config" >&2
            exit 1
          fi
          printf '%s\n' "$config"
        setVariables:
          - name: ZARF_CONFIG

  - name: vendor
    description: Vendor upstream Zarf package definitions at the shared pinned version
    inputs:
      architecture:
        default: ${ARCH}
    actions:
      - task: resolve-config
        with:
          architecture: ${{ .inputs.architecture }}
      - cmd: |
          if [ -f .zarf-src/.zarf-version ] && [ "$(sed -n '1p' .zarf-src/.zarf-version)" = "${ZARF_SOURCE_VERSION}" ]; then
            echo ".zarf-src already vendored for ${ZARF_SOURCE_VERSION}"
            exit 0
          fi

          if [ -d .zarf-src ]; then
            echo ".zarf-src does not match ${ZARF_SOURCE_VERSION}; move it before retrying" >&2
            exit 1
          fi

          git clone --depth 1 --branch "${ZARF_SOURCE_VERSION}" --filter=blob:none --sparse \
            https://github.com/zarf-dev/zarf.git .zarf-src
          git -C .zarf-src sparse-checkout set packages/zarf-agent packages/zarf-registry packages/gitea
          printf '%s\n' "${ZARF_SOURCE_VERSION}" > .zarf-src/.zarf-version

  - name: publish
    description: Publish one init package architecture to its metadata-derived OCI repository
    inputs:
      architecture:
        default: ${ARCH}
    actions:
      - task: resolve
      - cmd: |
          architecture="${{ .inputs.architecture }}"
          [ -n "$architecture" ] || architecture="${UDS_ARCH}"
          version=$(yq -r '.metadata.version' "${PACKAGE_PATH}/zarf.yaml")
          artifact="${PACKAGE_PATH}/zarf-init-${architecture}-${version}-${FLAVOR}.tar.zst"
          if [ ! -f "$artifact" ]; then
            echo "missing package artifact: $artifact" >&2
            exit 1
          fi
          uds zarf package publish "$artifact" "oci://${TARGET_REPO}" --retries "$PUBLISH_RETRIES"
