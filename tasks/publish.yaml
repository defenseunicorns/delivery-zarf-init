# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/tasks.schema.json

variables:
  - name: BASE_SHA
    default: HEAD^
  - name: HEAD_SHA
    default: HEAD
  - name: EVENT_NAME
    default: local
  - name: PR_TITLE
    default: ""
  - name: RELEASE_PLAN_FILE
    default: /tmp/delivery-zarf-init-release-plan.json

tasks:
  - name: plan
    description: Plan flavor releases and validate artifact version and Zarf agent readiness
    actions:
      - cmd: |
          release_version() {
            git show "$1:releaser.yaml" 2>/dev/null \
              | FLAVOR="$2" yq -r '.flavors[] | select(.name == env(FLAVOR)) | .version // ""' 2>/dev/null \
              || true
          }
          append() {
            printf '%s\n' "$1" | jq -c --arg value "$2" '. + [$value]'
          }
          tracked_values() {
            tracked_sha=$1
            tracked_flavor=$2
            for config in "zarf-config/${tracked_flavor}.yaml" "zarf-config/${tracked_flavor}-arm64.yaml"; do
              if git cat-file -e "$tracked_sha:$config" 2>/dev/null; then
                git show "$tracked_sha:$config" | yq -o=json -I=0 \
                  '.package.create.set | with_entries(select(.key == "zarf_source_version" or .key == "gitea_image" or (.key | test("_image_tag$"))))'
              fi
            done
          }

          all_flavors='["upstream","registry1","unicorn"]'
          expected_flavors='[]'
          release_flavors='[]'
          missing_versions='[]'
          unexpected_versions='[]'
          waiting='[]'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_flavors=$all_flavors
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              release_scope=$(printf '%s\n' "$PR_TITLE" | sed -nE 's/^[[:alnum:]-]+\(([^)]+)\)!?:.*/\1/p')
              case "$release_scope" in
                upstream|deps-upstream)
                  expected_flavors='["upstream"]'
                  ;;
                registry1|deps-registry1)
                  expected_flavors='["registry1"]'
                  ;;
                unicorn|deps-unicorn)
                  expected_flavors='["unicorn"]'
                  ;;
                shared|deps-shared)
                  expected_flavors=$all_flavors
                  ;;
              esac
            fi

            for flavor in upstream registry1 unicorn; do
              old_version=$(release_version "$BASE_SHA" "$flavor")
              new_version=$(release_version "$HEAD_SHA" "$flavor")

              if [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
                release_flavors=$(append "$release_flavors" "$flavor")
              fi

              if [ "$EVENT_NAME" = "pull_request" ]; then
                expected=$(printf '%s\n' "$expected_flavors" | jq -r --arg flavor "$flavor" 'index($flavor) != null')
                changed=false
                if [ -n "$new_version" ] && [ "$old_version" != "$new_version" ]; then
                  changed=true
                fi
                if [ -z "$new_version" ]; then
                  missing_versions=$(append "$missing_versions" "$flavor")
                elif [ "$expected" = "true" ] && [ "$changed" != "true" ]; then
                  missing_versions=$(append "$missing_versions" "$flavor")
                elif [ "$expected" != "true" ] && [ "$changed" = "true" ]; then
                  unexpected_versions=$(append "$unexpected_versions" "$flavor")
                fi
              fi

              if [ "$EVENT_NAME" != "pull_request" ]; then
                continue
              fi

              old_values=$(tracked_values "$BASE_SHA" "$flavor")
              new_values=$(tracked_values "$HEAD_SHA" "$flavor")
              if [ "$old_values" = "$new_values" ]; then
                continue
              fi

              old_source=$(git show "$BASE_SHA:zarf-config/${flavor}.yaml" | yq -r '.package.create.set.zarf_source_version // ""')
              new_source=$(git show "$HEAD_SHA:zarf-config/${flavor}.yaml" | yq -r '.package.create.set.zarf_source_version // ""')
              old_agent=$(git show "$BASE_SHA:zarf-config/${flavor}.yaml" | yq -r '.package.create.set.agent_image_tag')
              new_agent=$(git show "$HEAD_SHA:zarf-config/${flavor}.yaml" | yq -r '.package.create.set.agent_image_tag')

              # Establishing source-version tracking is ready when it matches the existing agent.
              if [ -z "$old_source" ] && [ "$new_source" = "$new_agent" ]; then
                continue
              fi

              ready=true
              if [ "$old_source" = "$new_source" ] || [ "$old_agent" = "$new_agent" ] \
                || [ "$new_source" != "$new_agent" ]; then
                ready=false
              fi

              if [ "$flavor" = "registry1" ]; then
                new_arm_agent=$(git show "$HEAD_SHA:zarf-config/registry1-arm64.yaml" | yq -r '.package.create.set.agent_image_tag')
                if [ "$new_arm_agent" != "${new_source}-arm64" ]; then
                  ready=false
                fi
              fi

              if [ "$ready" != "true" ]; then
                waiting=$(append "$waiting" "$flavor")
              fi
            done
          fi

          jq -n \
            --argjson flavors "$release_flavors" \
            --argjson expectedFlavors "$expected_flavors" \
            --argjson missingVersions "$missing_versions" \
            --argjson unexpectedVersions "$unexpected_versions" \
            --argjson waitingForAgent "$waiting" \
            '{
              flavors: $flavors,
              required: ($flavors | length > 0),
              expectedFlavors: $expectedFlavors,
              missingVersions: $missingVersions,
              unexpectedVersions: $unexpectedVersions,
              waitingForAgent: $waitingForAgent
            }' > "$RELEASE_PLAN_FILE"

  - name: resolve-target-repo
    description: Resolve the publish repository for FLAVOR
    actions:
      - cmd: |
          if [ -n "$TARGET_REPO" ]; then
            printf '%s\n' "$TARGET_REPO"
          elif [ -n "$REPO" ]; then
            printf '%s\n' "$REPO"
          elif [ "$FLAVOR" = "unicorn" ]; then
            printf '%s\n' "$PRIVATE_REPO"
          else
            printf '%s\n' "$PUBLIC_REPO"
          fi
        setVariables:
          - name: TARGET_REPO

  - name: package
    description: Build and publish the PACKAGE for FLAVOR (both architectures) to the resolved target repository
    inputs:
      package:
        description: The package (component set) to publish
        default: ${PACKAGE}
    actions:
      - task: package:resolve-package-version
      - task: resolve-target-repo
      - task: package:vendor
      - task: package:create
        with:
          package: ${{ .inputs.package }}
          architecture: amd64
      - task: package:create
        with:
          package: ${{ .inputs.package }}
          architecture: arm64
      - cmd: |
          package="${{ .inputs.package }}"
          suffix=""
          [ "$package" = "default" ] || suffix="-$package"
          pkg_version="${PACKAGE_VERSION}${suffix}"
          tag="${PACKAGE_VERSION}${suffix}-${FLAVOR}"

          for arch in amd64 arm64; do
            uds zarf package publish "zarf-init-${arch}-${pkg_version}-${FLAVOR}.tar.zst" "oci://${TARGET_REPO}" \
              --tag "$tag" --retries "$PUBLISH_RETRIES"
          done
