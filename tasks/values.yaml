# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/tasks.schema.json

tasks:
  - name: lint
    description: Lint values-bearing packages and validate their defaults
    actions:
      - description: Lint values-bearing packages
        cmd: |
          set -euo pipefail
          create_arguments=()
          while IFS=$'\t' read -r key value; do
            [ "${key}" = "pkg_version" ] && continue
            create_arguments+=(--set "${key^^}=${value}")
          done < <(yq -r '.package.create.set | to_entries[] | [.key, .value] | @tsv' zarf-config/upstream.yaml)
          create_arguments+=(--set PKG_VERSION=dev)
          for values_file in packages/*/zarf-values.yaml; do
            package_dir="${values_file%/zarf-values.yaml}"
            echo "Linting ${package_dir}"
            uds zarf dev lint "${package_dir}" --flavor upstream "${create_arguments[@]}"
          done
        shell:
          linux: bash
          darwin: bash
      - description: Validate default values against their schemas
        cmd: |
          set -euo pipefail
          for values_file in packages/*/zarf-values.yaml; do
            package_dir="${values_file%/zarf-values.yaml}"
            echo "Validating ${values_file}"
            uvx check-jsonschema \
              --schemafile "${package_dir}/zarf-values.schema.json" \
              "${values_file}"
          done
        shell:
          linux: bash
          darwin: bash

  - name: generate
    description: Regenerate schemas for packages that expose Zarf values
    actions:
      - description: Generate schemas atomically
        cmd: |
          set -euo pipefail
          create_arguments=()
          while IFS=$'\t' read -r key value; do
            [ "${key}" = "pkg_version" ] && continue
            create_arguments+=(--set "${key^^}=${value}")
          done < <(yq -r '.package.create.set | to_entries[] | [.key, .value] | @tsv' zarf-config/upstream.yaml)
          create_arguments+=(--set PKG_VERSION=dev)
          temporary_dir=$(mktemp -d)
          trap 'rm -rf "${temporary_dir}"' EXIT
          gitea_values="${temporary_dir}/gitea-values.yaml"
          gitea_url=$(yq -r '.components[] | select(.name == "git-server").charts[] | select(.name == "gitea").url' .zarf-src/packages/gitea/zarf.yaml)
          gitea_version=$(yq -r '.components[] | select(.name == "git-server").charts[] | select(.name == "gitea").version' src/init/common/zarf.yaml)
          uds zarf tools helm show values "${gitea_url}" \
            --version "${gitea_version}" > "${gitea_values}"
          for values_file in packages/*/zarf-values.yaml; do
            package_dir="${values_file%/zarf-values.yaml}"
            schema_file="${package_dir}/zarf-values.schema.json"
            temporary_schema="${temporary_dir}/$(basename "${package_dir}").json"
            echo "Generating ${schema_file}"
            uds zarf dev generate-schema "${package_dir}" \
              --flavor upstream \
              "${create_arguments[@]}" \
              --delete-not-found > "${temporary_schema}"
            uv run --with pyyaml python scripts/normalize-values-schema.py \
              "${temporary_schema}" \
              --agent-values .zarf-src/packages/zarf-agent/chart/values.yaml \
              --registry-values .zarf-src/packages/zarf-registry/chart/values.yaml \
              --gitea-values "${gitea_values}"
            mv "${temporary_schema}" "${schema_file}"
          done
        shell:
          linux: bash
          darwin: bash

  - name: check-generated
    description: Fail when committed Zarf values schemas are stale
    actions:
      - description: Compare generated schemas with committed schemas
        cmd: |
          set -euo pipefail
          create_arguments=()
          while IFS=$'\t' read -r key value; do
            [ "${key}" = "pkg_version" ] && continue
            create_arguments+=(--set "${key^^}=${value}")
          done < <(yq -r '.package.create.set | to_entries[] | [.key, .value] | @tsv' zarf-config/upstream.yaml)
          create_arguments+=(--set PKG_VERSION=dev)
          temporary_dir=$(mktemp -d)
          trap 'rm -rf "${temporary_dir}"' EXIT
          gitea_values="${temporary_dir}/gitea-values.yaml"
          gitea_url=$(yq -r '.components[] | select(.name == "git-server").charts[] | select(.name == "gitea").url' .zarf-src/packages/gitea/zarf.yaml)
          gitea_version=$(yq -r '.components[] | select(.name == "git-server").charts[] | select(.name == "gitea").version' src/init/common/zarf.yaml)
          uds zarf tools helm show values "${gitea_url}" \
            --version "${gitea_version}" > "${gitea_values}"
          for values_file in packages/*/zarf-values.yaml; do
            package_dir="${values_file%/zarf-values.yaml}"
            package_name="${package_dir#packages/}"
            generated_schema="${temporary_dir}/${package_name}.json"
            echo "Checking ${package_dir}/zarf-values.schema.json"
            uds zarf dev generate-schema "${package_dir}" \
              --flavor upstream \
              "${create_arguments[@]}" \
              --delete-not-found > "${generated_schema}"
            uv run --with pyyaml python scripts/normalize-values-schema.py \
              "${generated_schema}" \
              --agent-values .zarf-src/packages/zarf-agent/chart/values.yaml \
              --registry-values .zarf-src/packages/zarf-registry/chart/values.yaml \
              --gitea-values "${gitea_values}"
            if ! cmp -s "${generated_schema}" "${package_dir}/zarf-values.schema.json"; then
              echo "ERROR: ${package_dir}/zarf-values.schema.json is stale"
              echo "Run: uds run generate-zarf-values-schemas"
              exit 1
            fi
          done
        shell:
          linux: bash
          darwin: bash

  - name: render
    description: Verify allowed values pass through and excluded values do not
    actions:
      - description: Inspect rendered package manifests
        cmd: |
          set -euo pipefail
          create_arguments=()
          while IFS=$'\t' read -r key value; do
            [ "${key}" = "pkg_version" ] && continue
            create_arguments+=(--create-set "${key^^}=${value}")
          done < <(yq -r '.package.create.set | to_entries[] | [.key, .value] | @tsv' zarf-config/upstream.yaml)
          create_arguments+=(--create-set PKG_VERSION=dev)
          temporary_dir=$(mktemp -d)
          trap 'rm -rf "${temporary_dir}"' EXIT
          for override_file in tests/zarf-values/*.yaml; do
            package_name=$(basename "${override_file}" .yaml)
            package_dir="packages/${package_name}"
            rendered_file="${temporary_dir}/${package_name}.yaml"
            allowed_marker="ALLOWED_ZARF_VALUE_${package_name}"
            blocked_marker="SHOULD_NOT_APPEAR_${package_name}"

            echo "Rendering ${package_dir}"
            uds zarf dev inspect manifests "${package_dir}" \
              --flavor upstream \
              "${create_arguments[@]}" \
              --values "${package_dir}/zarf-values.yaml" \
              --values "${override_file}" \
              --no-color > "${rendered_file}"

            if ! grep -q "${allowed_marker}" "${rendered_file}"; then
              echo "ERROR: allowed Zarf value was not rendered for ${package_name}"
              exit 1
            fi
            if grep -q "${blocked_marker}" "${rendered_file}"; then
              echo "ERROR: excluded Zarf value was rendered for ${package_name}"
              exit 1
            fi
          done
        shell:
          linux: bash
          darwin: bash

  - name: test
    description: Run all Zarf values validation
    actions:
      - task: lint
      - task: check-generated
      - task: render
