# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/main/tasks.schema.json

tasks:
  - name: lint
    description: Lint Zarf values against the superset package
    actions:
      - cmd: ZARF_CONFIG=flavors/upstream.yaml uds zarf dev lint packages/init-gitea --flavor upstream

  - name: generate
    description: Regenerate schemas for all three init packages
    inputs:
      check:
        description: Fail instead of writing when generated schemas are stale
        default: "false"
    actions:
      - cmd: |
          set -eu
          # shellcheck disable=SC3040 # pipefail is standardized by POSIX.1-2024.
          set -o pipefail

          check="${{ .inputs.check }}"
          settings=$(mktemp)
          generated=""
          cleanup() {
            rm -f "$settings"
            if [ -n "$generated" ]; then
              rm -f "$generated"
            fi
          }
          trap cleanup 0
          trap 'exit 1' 1 2 3 15

          uds zarf tools yq -r \
            '.package.create.set | to_entries[] | select(.key != "pkg_version") | [.key, (.value | tostring)] | @tsv' \
            flavors/upstream.yaml > "$settings"

          set --
          tab=$(printf '\t')
          while IFS="$tab" read -r key value; do
            uppercase_key=$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')
            set -- "$@" --set "${uppercase_key}=${value}"
          done < "$settings"

          found=false
          stale=false

          for values_file in packages/*/zarf-values.yaml; do
            [ -e "$values_file" ] || continue
            found=true
            package_dir=${values_file%/*}
            schema_file="${package_dir}/zarf-values.schema.json"
            generated=$(mktemp)

            if [ "$check" = "true" ]; then
              action=Checking
            else
              action=Generating
            fi
            printf '%s %s\n' "$action" "$schema_file"

            ZARF_CONFIG=flavors/upstream.yaml uds zarf dev generate-schema "$package_dir" \
              --flavor upstream \
              "$@" \
              --delete-not-found \
              --no-color \
              --log-level error > "$generated"

            if [ "$check" = "true" ]; then
              if ! cmp -s "$schema_file" "$generated"; then
                printf 'ERROR: %s is stale\n' "$schema_file" >&2
                stale=true
              fi
              rm -f "$generated"
            else
              chmod 0644 "$generated"
              mv "$generated" "$schema_file"
            fi
            generated=""
          done

          if [ "$found" = "false" ]; then
            echo "no zarf-values.yaml files found" >&2
            exit 1
          fi

          if [ "$stale" = "true" ]; then
            echo "Run: uds run generate-zarf-values-schemas" >&2
            exit 1
          fi
        shell:
          linux: sh
          darwin: sh

  - name: check-generated
    description: Fail when committed Zarf values schemas are stale
    actions:
      - task: generate
        with:
          check: "true"

  - name: test-rendered-manifests
    description: Verify selected values affect rendered manifests and excluded values do not
    actions:
      - cmd: |
          set -eu
          # shellcheck disable=SC3040 # pipefail is standardized by POSIX.1-2024.
          set -o pipefail
          rendered=$(mktemp)
          trap 'rm -f "${rendered}"' 0

          ZARF_CONFIG=flavors/upstream.yaml uds zarf dev inspect manifests packages/init-gitea \
            --flavor upstream \
            --values tests/zarf-values-override.yaml \
            --set-values gitea.serviceAccount.annotations.values-test-excluded=blocked \
            --no-color \
            --log-level error > "${rendered}"

          uds zarf tools yq ea -e \
            '[select(.kind == "Deployment" and .metadata.name == "agent-hook") | .spec.replicas] | any_c(. == 1)' \
            "${rendered}" > /dev/null
          uds zarf tools yq ea -e \
            '[select(.kind == "Deployment" and .metadata.name == "zarf-docker-registry") | .spec.template.metadata.labels."values-test"] | any_c(. == "registry")' \
            "${rendered}" > /dev/null
          uds zarf tools yq ea -e \
            '[select(.kind == "Deployment" and .metadata.name == "zarf-docker-registry") | .spec.template.spec.volumes[] | select(.name == "data" and has("emptyDir"))] | length == 2' \
            "${rendered}" > /dev/null
          uds zarf tools yq ea -e \
            '[select(.kind == "PersistentVolumeClaim" and .metadata.name == "zarf-docker-registry")] | length == 0' \
            "${rendered}" > /dev/null
          uds zarf tools yq ea -e \
            '[select(.kind == "Deployment" and .metadata.name == "zarf-gitea") | .spec.template.metadata.labels."values-test"] | any_c(. == "gitea")' \
            "${rendered}" > /dev/null

          if grep -q 'values-test-excluded' "${rendered}"; then
            echo "excluded service account annotation was rendered" >&2
            exit 1
          fi
        shell:
          linux: sh
          darwin: sh

  - name: test-values-files
    description: Verify generated Helm values for the seed registry, main registry, and agent.
    actions:
      - description: Verify generated Helm values for the seed registry, main registry, and agent.
        shell: {linux: sh, darwin: sh}
        cmd: |
          set -eu
          # shellcheck disable=SC3040 # pipefail is standardized by POSIX.1-2024.
          set -o pipefail

          seed_init_default=$(mktemp)
          seed_init_multi=$(mktemp)
          seed_gitea_default=$(mktemp)
          seed_gitea_multi=$(mktemp)
          seed_gitea_multi_override=$(mktemp)
          seed=$(mktemp)
          registry=$(mktemp)
          agent=$(mktemp)
          trap 'rm -f "$seed_init_default" "$seed_init_multi" "$seed_gitea_default" "$seed_gitea_multi" "$seed_gitea_multi_override" "$seed" "$registry" "$agent"' 0

          ZARF_CONFIG=flavors/upstream.yaml uds zarf dev inspect values-files packages/init \
            --flavor upstream \
            --components zarf-seed-registry \
            --no-color --log-level error > "$seed_init_default"

          ZARF_CONFIG=flavors/upstream.yaml uds zarf dev inspect values-files packages/init \
            --flavor upstream \
            --components zarf-seed-registry \
            --set-values zarf-seed-registry.replicaCount=2 \
            --no-color --log-level error > "$seed_init_multi"

          ZARF_CONFIG=flavors/upstream.yaml uds zarf dev inspect values-files packages/init-gitea \
            --flavor upstream \
            --components zarf-seed-registry \
            --no-color --log-level error > "$seed_gitea_default"

          ZARF_CONFIG=flavors/upstream.yaml uds zarf dev inspect values-files packages/init-gitea \
            --flavor upstream \
            --components zarf-seed-registry \
            --set-values zarf-seed-registry.replicaCount=2 \
            --no-color --log-level error > "$seed_gitea_multi"

          ZARF_CONFIG=flavors/upstream.yaml uds zarf dev inspect values-files packages/init-gitea \
            --flavor upstream \
            --components zarf-seed-registry \
            --set-values zarf-seed-registry.replicaCount=2,zarf-seed-registry.persistence.enabled=true \
            --no-color --log-level error > "$seed_gitea_multi_override"

          ZARF_CONFIG=flavors/upstream.yaml uds zarf dev inspect values-files packages/init-gitea \
            --flavor upstream \
            --components zarf-seed-registry \
            --values tests/zarf-values-override.yaml \
            --no-color --log-level error > "$seed"

          ZARF_CONFIG=flavors/upstream.yaml uds zarf dev inspect values-files packages/init-gitea \
            --flavor upstream \
            --components zarf-registry \
            --values tests/zarf-values-override.yaml \
            --no-color --log-level error > "$registry"

          ZARF_CONFIG=flavors/upstream.yaml uds zarf dev inspect values-files packages/init-gitea \
            --flavor upstream \
            --components zarf-agent \
            --values tests/zarf-values-override.yaml \
            --no-color --log-level error > "$agent"

          assert_values() {
            if ! uds zarf tools yq ea -e \
              "[select($3)] | length == 1" "$2" > /dev/null; then
              printf '%s values assertion failed: %s\n' "$1" "$3" >&2
              return 1
            fi
          }

          assert_seed() { assert_values zarf-seed-registry "$seed" "$1"; }
          assert_registry() { assert_values zarf-registry "$registry" "$1"; }
          assert_agent() { assert_values zarf-agent "$agent" "$1"; }

          assert_values zarf-seed-registry "$seed_init_default" '.persistence.enabled == true'
          assert_values zarf-seed-registry "$seed_init_multi" '.replicaCount == 2'
          assert_values zarf-seed-registry "$seed_init_multi" '.persistence.enabled == false'

          assert_values zarf-seed-registry "$seed_gitea_default" '.persistence.enabled == true'
          assert_values zarf-seed-registry "$seed_gitea_multi" '.replicaCount == 2'
          assert_values zarf-seed-registry "$seed_gitea_multi" '.persistence.enabled == false'
          assert_values zarf-seed-registry "$seed_gitea_multi_override" '.replicaCount == 2'
          assert_values zarf-seed-registry "$seed_gitea_multi_override" '.persistence.enabled == true'

          uds zarf tools yq -e 'has("zarf-seed-registry") | not' \
            packages/init-agent-only/zarf-values.yaml > /dev/null
          uds zarf tools yq -e '.properties | has("zarf-seed-registry") | not' \
            packages/init-agent-only/zarf-values.schema.json > /dev/null

          assert_seed '.podLabels."values-test" == "seed-registry"'
          assert_seed '.persistence.enabled == false'

          assert_registry '.podLabels."values-test" == "registry"'
          assert_registry '.persistence.enabled == false'
          assert_registry '.autoscaling.minReplicas == 2'
          assert_registry '.autoscaling.mapReplicasToNodes == true'
          assert_registry '.serviceAccount.name == "docker-registry-sa"'
          assert_registry '.serviceAccount.create == true'
          assert_registry '.serviceAccount.annotations."values-test" == "registry-service-account"'
          assert_registry '(.extraEnvVars | length) == 1'
          assert_registry '.extraEnvVars[0].name == "REGISTRY_STORAGE"'
          assert_registry '.extraEnvVars[0].value == "s3"'
          assert_registry '.affinity.custom.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight == 100'
          assert_registry '.affinity.custom.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchExpressions[0].key == "app"'
          assert_registry '.affinity.custom.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchExpressions[0].operator == "In"'
          assert_registry '.affinity.custom.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchExpressions[0].values[0] == "docker-registry"'
          assert_registry '.affinity.custom.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey == "kubernetes.io/hostname"'
          assert_registry '(.tolerations | length) == 1'
          assert_registry '.tolerations[0].effect == "NoSchedule"'
          assert_registry '.tolerations[0].key == "dedicated"'
          assert_registry '.tolerations[0].operator == "Exists"'

          assert_agent '.resources.requests.memory == "128Mi"'
          assert_agent '.resources.limits.memory == "256Mi"'

  - name: test
    description: Validate Zarf values schemas, rendered manifests, and generated Helm values files
    actions:
      - task: lint
      - task: check-generated
      - task: test-rendered-manifests
      - task: test-values-files
