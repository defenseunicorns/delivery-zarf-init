zarf-agent:
  affinity:
    nodeAffinity: {}
  mutationExclusions:
    - argocd
  nodeSelector:
    kubernetes.io/os: linux
  serviceAccount:
    name: ALLOWED_ZARF_VALUE_agent-only
  tolerations:
    - key: zarf-values-test
      operator: Exists
  webhookAnnotations:
    zarf-values-test: native-types
  image:
    repository: SHOULD_NOT_APPEAR_agent-only
  secret: SHOULD_NOT_APPEAR_agent-only
