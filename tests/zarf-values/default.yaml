zarf-registry:
  extraEnvVars:
    - name: ZARF_VALUES_NATIVE_TYPES
      value: validated
  nodeSelector:
    kubernetes.io/os: linux
  persistence:
    enabled: true
  proxy:
    hostNetwork: false
  podLabels:
    zarf-values-test: ALLOWED_ZARF_VALUE_default
  image:
    repository: SHOULD_NOT_APPEAR_default
  serviceAccount:
    annotations: SHOULD_NOT_APPEAR_default
  tolerations:
    - key: zarf-values-test
      operator: Exists
