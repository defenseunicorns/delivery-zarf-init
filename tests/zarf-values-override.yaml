# Deploy-time zarf values overrides used by the test tasks - one observable override per chart
# key so the tests can assert the passthrough reaches every imported chart. Keys not present in
# a variant (e.g. gitea on the default variant) are ignored.
zarf-agent:
  # chart default is 2 replicas; seeing 1 proves the override landed
  deployment:
    replicaCount: 1
zarf-registry:
  # merged additively with the chart's own podLabels (zarf.dev/agent: ignore is preserved)
  podLabels:
    values-test: registry
gitea:
  deployment:
    labels:
      values-test: gitea
