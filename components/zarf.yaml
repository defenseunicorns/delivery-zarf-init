# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: init-src

components:
  - name: zarf-injector
    required: true
    import:
      path: ../.zarf-src/packages/zarf-registry

  - name: zarf-seed-registry
    required: true
    import:
      path: ../.zarf-src/packages/zarf-registry

  - name: zarf-registry
    required: true
    import:
      path: common

  # Duplicate the agent so each flavor resolves.
  - name: zarf-agent
    required: true
    import:
      path: common
    only:
      flavor: upstream
  - name: zarf-agent
    required: true
    import:
      path: common
    only:
      flavor: registry1
  - name: zarf-agent
    required: true
    import:
      path: common
    only:
      flavor: unicorn

  - name: git-server
    required: true
    import:
      path: common
