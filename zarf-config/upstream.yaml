package:
  create:
    set:
      pkg_version: upstream

      agent_image_domain: ghcr.io/
      agent_image: zarf-dev/zarf/agent
      # renovate: datasource=docker depName=ghcr.io/zarf-dev/zarf/agent versioning=docker
      agent_image_tag: v0.81.1

      registry_image_domain: ""
      registry_image: library/registry
      # renovate: datasource=docker depName=library/registry versioning=docker
      registry_image_tag: 3.1.1

      proxy_image_domain: ""
      proxy_image: alpine/socat
      # renovate: datasource=docker depName=alpine/socat versioning=docker
      proxy_image_tag: 1.8.1.3

      # tag format prevents IB anchoring; renovate cap enforces lockstep
      # renovate: datasource=docker depName=ghcr.io/go-gitea/gitea versioning=docker
      gitea_image: ghcr.io/go-gitea/gitea:1.27.0-rootless
